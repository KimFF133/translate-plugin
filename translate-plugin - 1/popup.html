<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      padding: 15px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .original {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      word-wrap: break-word;
      font-size: 14px;
      max-height: 150px;
      overflow-y: auto;
    }
    .translated {
      background: #e3f2fd;
      padding: 10px;
      border-radius: 8px;
      word-wrap: break-word;
      font-size: 14px;
      color: #0d47a1;
      max-height: 200px;
      overflow-y: auto;
    }
    .label {
      font-size: 12px;
      color: #555;
      margin-bottom: 4px;
    }
    .loading {
      color: #999;
      font-style: italic;
    }
    button {
      margin-top: 12px;
      width: 100%;
      padding: 6px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #0c5bcc;
    }
  </style>
</head>
<body>
  <div class="label"> 你选中的文字：</div>
  <div id="originalText" class="original"> 加载中...</div>
  <div class="label"> 翻译结果：</div>
  <div id="translatedText" class="translated loading">请稍后...</div>
  <button id="retryBtn"> 重新翻译</button>
  <script src="popup.js"></script>
</body>
</html>
